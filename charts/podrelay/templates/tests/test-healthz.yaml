apiVersion: v1
kind: Pod
metadata:
  name: {{ include "relay.fullname" . }}-test-healthz
  labels:
    {{- include "relay.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "relay.fullname" . }}:{{ .Values.service.port }}/healthz"]
