{{- if not .Values.sessionKey.existingSecret }}
{{- $name := include "relay.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
data:
  # Signs browser tickets and session cookies; kept across upgrades so
  # sessions survive them.
  key: {{ if and $existing $existing.data }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
