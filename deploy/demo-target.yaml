# Demo target pods for podrelay: stock sshd, no Service. The relay
# itself is installed with the Helm chart in charts/podrelay; this
# file is applied into the same namespace by `make deploy`.
---
# Target pods run stock sshd and have no Service; the relay dials podIP:22.
# Opt in with the fqix.github.io/ssh annotation (fqix.github.io/ssh-port overrides 22).
# fqix.github.io/authorized-keys is the single source of keys: the relay checks
# clients against it, and sshd reads it via the downward API volume below.
# Both follow `kubectl annotate` on a live pod without restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 2
  selector:
    matchLabels: {app: target}
  template:
    metadata:
      labels:
        app: target
      annotations:
        fqix.github.io/ssh: "true"
        fqix.github.io/authorized-keys: "__AUTHORIZED_KEYS__"  # filled in by `make deploy`
    spec:
      containers:
        - name: sshd
          image: podrelay-target:latest
          imagePullPolicy: Never
          ports: [{containerPort: 22}]
          readinessProbe:
            tcpSocket: {port: 22}
          volumeMounts:
            - {name: authorized-keys, mountPath: /etc/relay-ssh, readOnly: true}
      volumes:
        - name: authorized-keys
          downwardAPI:
            items:
              - path: authorized_keys
                fieldRef: {fieldPath: "metadata.annotations['fqix.github.io/authorized-keys']"}
---
# Only the relay may reach sshd and VS Code for the Web (podrelay web). Enforced only if the CNI supports
# NetworkPolicy (e.g. `minikube start --cni=calico`). Target pods in other
# namespaces need an equivalent policy with a namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-ssh-from-relay
spec:
  podSelector:
    matchLabels: {app: target}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: podrelay}
      ports:
        - {protocol: TCP, port: 22}
        - {protocol: TCP, port: 13337}
